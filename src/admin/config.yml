publish_mode: editorial_workflow

backend:
  name: git-gateway
  branch: main # Branch to update (optional; defaults to master)

# This enables local testing with `npx decap-server`
local_backend: true

media_folder: "src/images"
public_folder: "/images"

collections:
  - name: "posts"
    label: "Literature"
    folder: "src/posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Publish Date", name: "date", widget: "datetime"}
      - {label: "Author", name: "author", widget: "hidden",}
      - {label: "Last Editor", name: "last_editor", widget: "hidden", required: false}
      - {label: "Last Editor Role", name: "last_editor_role", widget: "hidden", required: false}
      - {label: "Description (Short)", name: "description", widget: "string", required: false}
      - {label: "Tags", name: "tags", widget: "list", default: ["posts"]}
      - {label: "Body", name: "body", widget: "markdown"}
      - {label: "Author Notes", name: "author_notes", widget: "markdown", required: false}
      - {label: "Editor Notes", name: "editor_notes", widget: "markdown", required: false}

  - name: "docs"
    label: "Documentation"
    folder: "src/docs"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Category", name: "category", widget: "category-input", default: "Contribution Flow"}
      - {label: "Description (Short)", name: "description", widget: "string", required: false}
      - {label: "Order", name: "order", widget: "number", default: 1, value_type: "int"}
      - {label: "Body", name: "body", widget: "markdown"}

  - name: "announcements"
    label: "Announcements"
    folder: "src/announcements"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    sortable_fields: ['date', 'title']
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Creation Date", name: "date", widget: "datetime"}
      - {label: "Badge / Type", name: "badge", widget: "select", options: ["Notice", "Update", "New Feature", "Community", "Maintenance"], default: "Notice"}
      - {label: "Pin to Top Header Banner?", name: "is_banner", widget: "boolean", default: true, hint: "When enabled, this announcement will be featured at the top of the site header."}
      - {label: "Short Banner Headline", name: "banner_text", widget: "string", required: false, hint: "Short summary for the banner. Defaults to Title if left blank."}
      - {label: "Custom Action Link URL", name: "link_url", widget: "string", required: false, hint: "Optional link (if blank, links directly to this announcement card on the announcements page)"}
      - {label: "Action Link Text", name: "link_text", widget: "string", required: false, default: "Read announcement →"}
      - label: "Banner Style"
        name: "style"
        widget: "select"
        options:
          - {label: "Default (Charcoal & Warm Ember)", value: "default"}
          - {label: "Accent (Glowing Flame)", value: "accent"}
          - {label: "Subtle (Minimal Surface)", value: "subtle"}
        default: "default"
        required: false
      - {label: "Announcement Content", name: "body", widget: "markdown"}

  - name: "settings"
    label: "Site Settings"
    delete: false
    editor:
      preview: false
    files:
      - name: "banner"
        label: "Announcement Banner"
        file: "src/_data/banner.json"
        description: "Configure the top announcement banner shown on the website."
        format: "json"
        fields:
          - {label: "Enable Banner", name: "enabled", widget: "boolean", default: true}
          - {label: "Announcement ID", name: "id", widget: "string", default: "announcement-1", hint: "Change this ID (e.g., 'announcement-2') whenever you publish a new announcement so visitors who dismissed an earlier one will see this new one."}
          - {label: "Badge / Tag", name: "badge", widget: "string", default: "Notice", required: false, hint: "Optional short label (e.g. 'Notice', 'Update', 'New')"}
          - {label: "Announcement Message", name: "message", widget: "string", default: "Welcome to By the Campfire! Pull up a chair and explore our stories and reflections."}
          - {label: "Link URL", name: "link_url", widget: "string", required: false, hint: "Optional URL (e.g. /docs/ or /about/)"}
          - {label: "Link Text", name: "link_text", widget: "string", default: "About Us →", required: false}
          - {label: "Dismissable", name: "dismissable", widget: "boolean", default: true, hint: "Allow visitors to dismiss the banner"}
          - label: "Style"
            name: "style"
            widget: "select"
            options:
              - {label: "Default (Charcoal & Warm Ember)", value: "default"}
              - {label: "Accent (Glowing Flame)", value: "accent"}
              - {label: "Subtle (Minimal Surface)", value: "subtle"}
            default: "default"
            required: false


