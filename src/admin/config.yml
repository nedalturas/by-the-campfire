publish_mode: editorial_workflow

backend:
  name: git-gateway
  branch: main # Branch to update (optional; defaults to master)

# This enables local testing with `npx decap-server`
local_backend: true

media_folder: "src/images"
public_folder: "/images"

collections:
  - name: "posts"
    label: "Literature"
    folder: "src/posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Publish Date", name: "date", widget: "datetime"}
      - {label: "Author", name: "author", widget: "hidden",}
      - {label: "Last Editor", name: "last_editor", widget: "hidden", required: false}
      - {label: "Last Editor Role", name: "last_editor_role", widget: "hidden", required: false}
      - {label: "Description (Short)", name: "description", widget: "string", required: false}
      - {label: "Tags", name: "tags", widget: "list", default: ["posts"]}
      - {label: "Body", name: "body", widget: "markdown"}
      - {label: "Author Notes", name: "author_notes", widget: "markdown", required: false}
      - {label: "Editor Notes", name: "editor_notes", widget: "markdown", required: false}

  - name: "docs"
    label: "Documentation"
    folder: "src/docs"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Category", name: "category", widget: "category-input", default: "Contribution Flow"}
      - {label: "Description (Short)", name: "description", widget: "string", required: false}
      - {label: "Order", name: "order", widget: "number", default: 1, value_type: "int"}
      - {label: "Body", name: "body", widget: "markdown"}

