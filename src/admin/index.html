<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Manager - By the Campfire</title>
  <!-- Include the script that enables Netlify Identity on this page. -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>

<body>
  <!-- Include the script that builds the page and powers Decap CMS -->
  <script src="https://unpkg.com/decap-cms@^3.1.0/dist/decap-cms.js"></script>

  <script>
    CMS.registerEventListener({
      name: 'preSave',
      handler: ({ entry }) => {
        console.log("preSave triggered");

        const user = window.netlifyIdentity && window.netlifyIdentity.currentUser();
        console.log("user:", user);

        if (user) {
          const metadata = user.user_metadata || {};
          const name = metadata.full_name || metadata.name || user.email;

          return entry.get('data').set('author', name);
        }
        return entry;
      }
    });

    // Editor workflow
    CMS.registerEventListener({
        name: 'prePublish',
        handler: () =>{
          const user = netlifyIdentity.currentUser();
          const roles = user?.app_metadata?.roles || [];
          if (!roles.includes('proofreader')){
            alert("Only proofreaders can publish - move it to review instead.");
            throw new Error('blocked: not a proofreader');
          }
        },
      });


    // Lock editor notes field for non-proofreaders
function restrictNotesField(user) {
  if (!user) return;
  
  user.jwt(true).then((token) => {
    const payload = JSON.parse(atob(token.split('.')[1]));
    const roles = payload.app_metadata?.roles || [];
    
    if (roles.includes('proofreader')) return; 

    const observer = new MutationObserver(() => {
      const labels = Array.from(document.querySelectorAll('label'));
      // Use trim() and startsWith() to catch it even if Decap adds asterisks for required fields
      const notesLabel = labels.find(el => el.textContent.trim().startsWith('Editor Notes'));
      
      if (notesLabel) {
        // Target the parent container wrapping the label and the input
        const fieldContainer = notesLabel.parentElement;
        
        // Apply CSS lock if not already applied
        if (fieldContainer && fieldContainer.style.pointerEvents !== 'none') {
          fieldContainer.style.pointerEvents = 'none';
          fieldContainer.style.opacity = '0.5';
          
          // Also catch tab-navigation by disabling actual inputs inside the container
          const inputs = fieldContainer.querySelectorAll('input, textarea');
          inputs.forEach(input => {
            input.disabled = true;
          });
        }
      }
    });
    
    observer.observe(document.body, { childList: true, subtree: true });
  });
}

    netlifyIdentity.on('init', restrictNotesField);

  </script>
</body>

</html>
