<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Manager - By the Campfire</title>
  <!-- Netlify Identity widget -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>

<body>
  <!-- Decap CMS -->
  <script src="https://unpkg.com/decap-cms@^3.1.0/dist/decap-cms.js"></script>

  <script>
    // Stamp the logged-in user's name as the author on save.
    CMS.registerEventListener({
      name: 'preSave',
      handler: ({ entry }) => {
        const data = entry.get('data');

        const user = window.netlifyIdentity && window.netlifyIdentity.currentUser();
        if (!user) return data;

        const meta = user.user_metadata || {};
        const name = meta.full_name || meta.name || user.email;
        const roles = user.app_metadata?.roles || [];
        // return entry.get('data').set('author', name);

        let updatedData = data;

        if(!data.get('author')){
          updatedData = updatedData.set('author', name);
        }

        // Always record whoever is currently saving as the latest editor
        updatedData = updatedData.set('last_editor', name);

        // Record this editor's role
        updatedData = updatedData.set(
          'last_editor_role',
          roles.includes('proofreader') ? 'proofreader' : 'writer'
        );

        return updatedData;
      }
    });

    // Editorial workflow: only proofreaders can publish.
    CMS.registerEventListener({
      name: 'prePublish',
      handler: () => {
        const user = window.netlifyIdentity.currentUser();
        const roles = user?.app_metadata?.roles || [];
        if (!roles.includes('proofreader')) {
          alert('Only proofreaders can publish - move it to review instead.');
          throw new Error('blocked: not a proofreader');
        }
      }
    });

    // Editorial workflow: only proofreaders can move a post to "Ready to Publish".
    // Decap has no preStatusChange hook and preSave doesn't fire on dropdown-only
    // status changes, so we hide the option from the DOM instead — same pattern
    // as the Editor Notes restriction below.
    let statusObserver;

    function restrictStatusDropdown(user) {
      const roles = user?.app_metadata?.roles || [];
      if (!user || roles.includes('proofreader')) return;

      const hideReady = () => {
        // From DOM inspection: the "Ready" H2 is a direct child of the column div.
        // So heading.parentElement is exactly the column container to hide.
        document.querySelectorAll('h2').forEach(heading => {
          if (/^ready$/i.test(heading.textContent.trim())) {
            const column = heading.parentElement;
            if (column) column.style.display = 'none';
          }
        });

        // Also hide "Ready to Publish" from status dropdowns inside the article editor.
        document.querySelectorAll('button, [role="menuitem"], [role="option"], li').forEach(el => {
          if (/^ready(\s+to\s+publish)?$/i.test(el.textContent.trim())) {
            el.style.display = 'none';
            el.setAttribute('aria-hidden', 'true');
          }
        });
      };

      statusObserver?.disconnect();
      statusObserver = new MutationObserver(hideReady);
      statusObserver.observe(document.body, { childList: true, subtree: true });
      hideReady();
    }

    netlifyIdentity.on('init', restrictStatusDropdown);
    netlifyIdentity.on('login', restrictStatusDropdown);


    // Make the Editor Notes field read-only for everyone except proofreaders.
    let notesObserver;

    function restrictNotesField(user) {
      const roles = user?.app_metadata?.roles || [];
      if (!user || roles.includes('proofreader')) return;

      const lock = () => {
        const label = [...document.querySelectorAll('label')]
          .find(l => /^editor notes/i.test(l.textContent.trim()));
        const field = label?.parentElement?.parentElement;
        if (!field || field.inert) return;

        field.inert = true;            // blocks click, focus, typing
        field.style.opacity = '0.6';   // visual hint only
      };

      notesObserver?.disconnect();     // avoid stacking observers on init + login
      notesObserver = new MutationObserver(lock);
      notesObserver.observe(document.body, { childList: true, subtree: true });
      lock();
    }

    netlifyIdentity.on('init', restrictNotesField);
    netlifyIdentity.on('login', restrictNotesField);


    // ---------------------------------------------------------------------------
    // Force-save before a proofreader moves a post back to Draft.
    //
    // Decap has no preStatusChange hook, and preSave doesn't fire on
    // dropdown-only status changes. So we intercept the "Drafts" click in the
    // status dropdown. If the logged-in user is a proofreader, we:
    //   1. Cancel the click
    //   2. Dispatch a CMS save (stamps last_editor_role: "proofreader")
    //   3. Re-click the element after a short delay so the status change proceeds
    //
    // This guarantees the GitHub webhook always sees the correct last_editor_role
    // when it fires on the PR label change.
    // ---------------------------------------------------------------------------
    let draftInterceptObserver;

    function interceptDraftStatusChange(user) {
      const roles = user?.app_metadata?.roles || [];
      if (!user || !roles.includes('proofreader')) return;

      let isSavingBeforeStatus = false;

      const intercept = () => {
        document.querySelectorAll('button, [role="menuitem"], [role="option"], li').forEach(el => {
          if (/^draft(s)?$/i.test(el.textContent.trim()) && !el.dataset.draftIntercepted) {
            el.dataset.draftIntercepted = 'true';
            el.addEventListener('click', async (e) => {
              if (isSavingBeforeStatus) return; // allow the re-click through
              e.preventDefault();
              e.stopPropagation();

              isSavingBeforeStatus = true;
              try {
                // Trigger a CMS save so preSave fires and stamps last_editor_role
                CMS.store.dispatch({ type: 'DRAFT_PERSIST_UI' });
                // Brief pause to let the save round-trip before re-clicking
                await new Promise(resolve => setTimeout(resolve, 1500));
              } catch (_) {
                // Even if save fails, still allow the status change
              } finally {
                isSavingBeforeStatus = false;
                el.click(); // re-fire the original click
              }
            }, { capture: true });
          }
        });
      };

      draftInterceptObserver?.disconnect();
      draftInterceptObserver = new MutationObserver(intercept);
      draftInterceptObserver.observe(document.body, { childList: true, subtree: true });
      intercept();
    }

    netlifyIdentity.on('init', interceptDraftStatusChange);
    netlifyIdentity.on('login', interceptDraftStatusChange);


    // Custom Preview Template to visually separate Editor Notes
    const PostPreview = createClass({
      render: function() {
        const entry = this.props.entry;
        const date = entry.getIn(['data', 'date']);
        const description = entry.getIn(['data', 'description']);
        const hasNotes = entry.getIn(['data', 'editor_notes']);

        return h('div', { style: { padding: '15px', fontFamily: 'system-ui, sans-serif' } },

          // Render Title, Date, and Description
          h('h1', {}, entry.getIn(['data', 'title'])),
          date ? h('p', { style: { color: '#888' } }, String(date)) : null,
          description ? h('p', {}, h('strong', {}, 'Description: '), description) : null,

          // Render Body
          h('div', { style: { marginTop: '30px', paddingBottom: '40px' } }, this.props.widgetFor('body')),

          // Render Editor Notes (Only if there is actually feedback written)
          hasNotes ? h('div', {
            style: {
              marginTop: '20px',
              padding: '20px',
              backgroundColor: '#fff1f0', // Light red background
              borderTop: '5px solid #ff4d4f', // Thick red divider line
              borderRadius: '0 0 8px 8px'
            }
          }, 
            h('h2', { style: { margin: '0 0 15px 0', color: '#cf1322' } }, "🛑 Proofreader Feedback"),
            this.props.widgetFor('editor_notes')
          ) : null
        );
      }
    });

    // Apply this template to the 'posts' collection
    CMS.registerPreviewTemplate("posts", PostPreview);
  </script>
</body>

</html>
