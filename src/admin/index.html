<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Manager - By the Campfire</title>
  <!-- Include the script that enables Netlify Identity on this page. -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>

<body>
  <!-- Include the script that builds the page and powers Decap CMS -->
  <script src="https://unpkg.com/decap-cms@^3.1.0/dist/decap-cms.js"></script>

  <script>
    CMS.registerEventListener({
      name: 'preSave',
      handler: ({ entry }) => {
        console.log("preSave triggered");

        const user = window.netlifyIdentity && window.netlifyIdentity.currentUser();
        console.log("user:", user);

        if (user) {
          const metadata = user.user_metadata || {};
          const name = metadata.full_name || metadata.name || user.email;

          return entry.get('data').set('author', name);
        }
        return entry;
      }
    });

    // Editor workflow
    CMS.registerEventListener({
        name: 'prePublish',
        handler: () =>{
          const user = netlifyIdentity.currentUser();
          const roles = user?.app_metadata?.roles || [];
          if (!roles.includes('proofreader')){
            alert("Only proofreaders can publish - move it to review instead.");
            throw new Error('blocked: not a proofreader');
          }
        },
      });

    // Lock editor notes field for non-proofreaders
    function restrictNodesField(user){
      if(!user) return;

      user.jwt(true).then((token) =>{
        const payload = JSON.parse(atob(token.split('.')[1]));
        const roles = payload.app_metadata.roles || [];

        if(roles.includes('proofreader')) return;

        const observer = new MutationObserver(() => {
          const labels = Array.from(document.querySelectorAll('label'));

          const notesLabel = labels.find(el => el.textContent.includes('Editor Notes'));

          if(notesLabel){
            const inputId = notesLabel.getAttribute('for');
            const inputField = document.getElementById(inputId);

            if(inputField && !inputField.disabled){
              inputField.disabled = true;
              inputField.placeholder = "Editor Notes (locked for non-proofreaders)";
              inputField.style.opacity = 0.5;
              inputField.style.cursor = 'not-allowed';
            }
          }
        })
        observer.observe(document.body, { childList: true, subtree: true });
      })
    }

    window.netlify.on('init', restrictNodesField);
    window.netlify.on('login', restrictNodesField);
  </script>
</body>

</html>
