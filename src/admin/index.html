<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Manager - By the Campfire</title>
  <!-- Netlify Identity widget -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>

<body>
  <!-- Decap CMS -->
  <script src="https://unpkg.com/decap-cms@^3.1.0/dist/decap-cms.js"></script>

  <script>
    // Custom widget: Allows picking from suggestions OR typing a brand-new category
    const CategoryControl = createClass({
      handleChange: function (e) {
        this.props.onChange(e.target.value);
      },
      render: function () {
        const value = this.props.value || '';
        const suggestedCategories = [
          "Contribution Flow",
          "Author Guidelines",
          "Codebase & Architecture",
          "Style Guide"
        ];
        return h('div', { style: { display: 'flex', flexDirection: 'column', gap: '6px' } },
          h('input', {
            type: 'text',
            list: 'category-datalist-options',
            value: value,
            placeholder: 'Select a category or type a new one...',
            onChange: this.handleChange,
            className: this.props.classNameWrapper,
            style: {
              padding: '10px 12px',
              border: '1px solid #ccc',
              borderRadius: '4px',
              fontSize: '14px',
              backgroundColor: '#fff',
              color: '#333'
            }
          }),
          h('datalist', { id: 'category-datalist-options' },
            suggestedCategories.map((cat, i) => h('option', { key: i, value: cat }))
          ),
          h('small', { style: { color: '#888', fontSize: '12px' } },
            'Tip: Click to choose an existing category, or simply type a new one.'
          )
        );
      }
    });

    CMS.registerWidget('category-input', CategoryControl);

    // Stamp the logged-in user's name as the author on save.
    CMS.registerEventListener({
      name: 'preSave',
      handler: ({ entry }) => {
        const collection = entry.get('collection');
        const user = window.netlifyIdentity && window.netlifyIdentity.currentUser();
        const roles = user?.app_metadata?.roles || [];

        //1. Hard security guard for Docs: Only admin can save documentation

        if (collection === 'docs') {
          if (!roles.includes('admin')) {
            alert('Permission denied: Only Admins can modify documentation');
            throw new Error('blocked: not an Admin');
          }

          return entry.get('data');
          // Admins save docs directly
        }

        // 2. Existing logic for literature posts

        const data = entry.get('data');
        if (!user) return data;

        const meta = user.user_metadata || {};
        const name = meta.full_name || meta.name || user.email;

        let updatedData = data;

        if (!data.get('author')) {
          updatedData = updatedData.set('author', name);
        }

        // Always record whoever is currently saving as the latest editor
        updatedData = updatedData.set('last_editor', name);

        // Record this editor's role
        updatedData = updatedData.set(
          'last_editor_role',
          roles.includes('proofreader') ? 'proofreader' : (roles.includes('admin') ? 'admin' : 'writer')
        );

        return updatedData;
      }

    });

    // Editorial workflow: only proofreaders can publish.
    CMS.registerEventListener({
      name: 'prePublish',
      handler: ({ entry }) => {
        const user = window.netlifyIdentity?.currentUser();
        const roles = user?.app_metadata?.roles || [];
        const collection = entry?.get?.('collection');

        // Docs require Admin to publish
        if (collection === 'docs') {
          if (!roles.includes('admin')) {
            alert('Permission denied: Only Admins can publish documentation');
            throw new Error('blocked: not an Admin');
          }

          return;
        }

        // Regular literature posts allow proofreader OR Admin
        if (!roles.includes('proofreader') && !roles.includes('admin')) {
          alert('Only proofreaders can publish - move it to review instead.');

          throw new Error('blocked: not a proofreader');
        }

      }
    });

    // Editorial workflow restrictions for writers:
    // 1. Only proofreaders can move a post to "Ready to Publish".
    // 2. Only proofreaders can move an "In Review" post back to "Draft" (request changes).
    // Writers submit from Draft -> In Review, and cannot reject their own in-review posts.
    let statusObserver;

    function restrictStatusDropdown(user) {
      const roles = user?.app_metadata?.roles || [];
      if (!user || roles.includes('proofreader') || roles.includes('admin')) return;

      const enforceWriterRestrictions = () => {
        // 1. Hide the "Ready" column completely on the workflow board
        document.querySelectorAll('h2').forEach(heading => {
          if (/^ready$/i.test(heading.textContent.trim())) {
            const column = heading.parentElement;
            if (column) column.style.display = 'none';
          }
        });

        // 2. Prevent writers from dragging cards out of "In Review" on the workflow board
        document.querySelectorAll('h2').forEach(heading => {
          if (/^in\s+review$/i.test(heading.textContent.trim())) {
            const column = heading.parentElement;
            if (column && !column.dataset.writerLocked) {
              column.dataset.writerLocked = 'true';
              const blockDrag = (e) => {
                if (e.target.closest('a, [data-rbd-draggable-id], [draggable], div')) {
                  e.stopPropagation();
                }
              };
              column.addEventListener('dragstart', (e) => e.preventDefault(), true);
              column.addEventListener('mousedown', blockDrag, true);
              column.addEventListener('touchstart', blockDrag, true);
            }
          }
        });

        // 3. Hide "Ready to Publish" from status dropdowns inside the article editor
        document.querySelectorAll('button, [role="menuitem"], [role="option"], li').forEach(el => {
          if (/^ready(\s+to\s+publish)?$/i.test(el.textContent.trim())) {
            el.style.display = 'none';
            el.setAttribute('aria-hidden', 'true');
          }
        });

        // 4. In article editor: if the post is already "In Review", writers cannot move it back to "Draft"
        const isEntryInReview = Array.from(document.querySelectorAll('button')).some(btn =>
          /in\s+review/i.test(btn.textContent.trim()) && !btn.hasAttribute('role')
        );

        if (isEntryInReview) {
          document.querySelectorAll('button, [role="menuitem"], [role="option"], li').forEach(el => {
            if (/^draft(s)?$/i.test(el.textContent.trim())) {
              el.style.display = 'none';
              el.setAttribute('aria-hidden', 'true');
            }
          });
        }
      };

      statusObserver?.disconnect();
      statusObserver = new MutationObserver(enforceWriterRestrictions);
      statusObserver.observe(document.body, { childList: true, subtree: true });
      enforceWriterRestrictions();
    }

    netlifyIdentity.on('init', restrictStatusDropdown);
    netlifyIdentity.on('login', restrictStatusDropdown);


    // Make the Editor Notes field read-only for everyone except proofreaders.
    let notesObserver;

    function restrictNotesField(user) {
      const roles = user?.app_metadata?.roles || [];
      if (!user || roles.includes('proofreader') || roles.includes('admin')) return;

      const lock = () => {
        const label = [...document.querySelectorAll('label')]
          .find(l => /^editor notes/i.test(l.textContent.trim()));
        const field = label?.parentElement?.parentElement;
        if (!field || field.inert) return;

        field.inert = true;            // blocks click, focus, typing
        field.style.opacity = '0.6';   // visual hint only
      };

      notesObserver?.disconnect();     // avoid stacking observers on init + login
      notesObserver = new MutationObserver(lock);
      notesObserver.observe(document.body, { childList: true, subtree: true });
      lock();
    }

    // Hide the Documentation collection from non-admins in Decap UI

    let docsObserver;

    function restrictDocsCollection(user) {
      const roles = user?.app_metadata?.roles || [];
      if (!user || roles.includes('admin')) return; // Admins see everything
      const lockDocsUI = () => {
        // 1. Hide the "Documentation" link in the sidebar / collections list
        document.querySelectorAll('a[href*="/collections/docs"]').forEach(link => {
          const item = link.closest('li') || link;
          if (item) item.style.display = 'none';
        });
        // 2. Prevent direct URL navigation to #/collections/docs
        if (window.location.hash.includes('/collections/docs')) {
          window.location.hash = '#/collections/posts';
          alert('Access restricted: Only admins can manage documentation');
        }
      };
      docsObserver?.disconnect();
      docsObserver = new MutationObserver(lockDocsUI);
      docsObserver.observe(document.body, { childList: true, subtree: true });
      window.addEventListener('hashchange', lockDocsUI);
      lockDocsUI();
    }

    netlifyIdentity.on('init', restrictDocsCollection);
    netlifyIdentity.on('login', restrictDocsCollection);

    // Hide the Dashboard link in the sidebar from non-admins in Decap UI

    let dashboardObserver;

    function restrictDashboardCollection(user) {
      const roles = user?.app_metadata?.roles || [];

      if (!user || roles.includes('admin')) return; // Admins see everything

      const lockDashboardUI = () => {
        // 1. Hide the "Dashboard" link in the sidebar / collections list
        document.querySelectorAll('a[href="/dashboard"]').forEach(link => {
          const item = link.closest('li') || link;

          if (item) item.style.display = 'none';
        });
      }

      dashboardObserver.disconnect();
      dashboardObserver = new MutationObserver(lockDashboardUI);
      dashboardObserver.observe(document.body, { childList: true, subtree: true });
      lockDashboardUI();
    }

    netlifyIdentity.on('init', restrictDashboardCollection);
    netlifyIdentity.on('login', restrictDashboardCollection);



    // Custom Preview Template to visually separate Editor Notes
    const PostPreview = createClass({
      render: function () {
        const entry = this.props.entry;
        const date = entry.getIn(['data', 'date']);
        const description = entry.getIn(['data', 'description']);
        const hasNotes = entry.getIn(['data', 'editor_notes']);
        const hasAuthorNotes = entry.getIn(['data', 'author_notes']);

        return h('div', { style: { padding: '15px', fontFamily: 'system-ui, sans-serif' } },

          // Render Title, Date, and Description
          h('h1', {}, entry.getIn(['data', 'title'])),
          date ? h('p', { style: { color: '#888' } }, String(date)) : null,
          description ? h('p', {}, h('strong', {}, 'Description: '), description) : null,

          // Render Body
          h('div', { style: { marginTop: '30px', paddingBottom: '40px' } }, this.props.widgetFor('body')),

          // Render Author Notes (Only if there is feedback/remarks from the author)
          hasAuthorNotes ? h('div', {
            style: {
              marginTop: '20px',
              padding: '20px',
              backgroundColor: '#e6f7ff', // Light blue background
              borderTop: '5px solid #1890ff', // Blue divider line
              borderRadius: '0 0 8px 8px'
            }
          },
            h('h2', { style: { margin: '0 0 15px 0', color: '#0050b3' } }, "Author Notes"),
            this.props.widgetFor('author_notes')
          ) : null,

          // Render Editor Notes (Only if there is actually feedback written)
          hasNotes ? h('div', {
            style: {
              marginTop: '20px',
              padding: '20px',
              backgroundColor: '#fff1f0', // Light red background
              borderTop: '5px solid #ff4d4f', // Thick red divider line
              borderRadius: '0 0 8px 8px'
            }
          },
            h('h2', { style: { margin: '0 0 15px 0', color: '#cf1322' } }, "Proofreader Feedback"),
            this.props.widgetFor('editor_notes')
          ) : null
        );
      }
    });

    // Apply this template to the 'posts' collection
    CMS.registerPreviewTemplate("posts", PostPreview);
  </script>
</body>

</html>
