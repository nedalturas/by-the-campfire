<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Manager - By the Campfire</title>
  <!-- Netlify Identity widget -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>

<body>
  <!-- Decap CMS -->
  <script src="https://unpkg.com/decap-cms@^3.1.0/dist/decap-cms.js"></script>

  <script>
    // Stamp the logged-in user's name as the author on save.
    CMS.registerEventListener({
      name: 'preSave',
      handler: ({ entry }) => {
        const data = entry.get('data');
        if(data.get('author')) return data;

        const user = window.netlifyIdentity && window.netlifyIdentity.currentUser();
        if (!user) return data;

        const meta = user.user_metadata || {};
        const name = meta.full_name || meta.name || user.email;
        // return entry.get('data').set('author', name);
        return data.set('author', name);
      }
    });

    // Editorial workflow: only proofreaders can publish.
    CMS.registerEventListener({
      name: 'prePublish',
      handler: () => {
        const user = window.netlifyIdentity.currentUser();
        const roles = user?.app_metadata?.roles || [];
        if (!roles.includes('proofreader')) {
          alert('Only proofreaders can publish - move it to review instead.');
          throw new Error('blocked: not a proofreader');
        }
      }
    });

    // Make the Editor Notes field read-only for everyone except proofreaders.
    let notesObserver;

    function restrictNotesField(user) {
      const roles = user?.app_metadata?.roles || [];
      if (!user || roles.includes('proofreader')) return;

      const lock = () => {
        const label = [...document.querySelectorAll('label')]
          .find(l => /^editor notes/i.test(l.textContent.trim()));
        const field = label?.parentElement?.parentElement;
        if (!field || field.inert) return;

        field.inert = true;            // blocks click, focus, typing
        field.style.opacity = '0.6';   // visual hint only
      };

      notesObserver?.disconnect();     // avoid stacking observers on init + login
      notesObserver = new MutationObserver(lock);
      notesObserver.observe(document.body, { childList: true, subtree: true });
      lock();
    }

    netlifyIdentity.on('init', restrictNotesField);
    netlifyIdentity.on('login', restrictNotesField);
  </script>
</body>

</html>
